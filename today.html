<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>今日任务｜GPT</title>
  <link rel="stylesheet" href="today.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div><div class="eyebrow">GPT 个人任务系统</div><h1>今日任务</h1><div id="date" class="date"></div></div>
      <div id="countPill" class="pill">0 / 0</div>
    </header>

    <section class="notice setup" id="setupPanel" hidden>
      <strong>云同步尚未配置</strong>
      <p>请先按仓库 `DEPLOYMENT.md` 填写 Supabase 公开客户端配置。</p>
    </section>

    <section class="card auth" id="authPanel" hidden>
      <div class="eyebrow">SECURE CLOUD SYNC</div>
      <h2>登录后开始同步</h2>
      <p class="muted">输入邮箱获取一次性登录链接，手机和电脑会看到同一份真实状态。</p>
      <form id="loginForm">
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="name@example.com">
        <button type="submit">发送登录链接</button>
      </form>
      <div id="loginMessage" class="hint" role="status"></div>
    </section>

    <div id="cloudContent" hidden>
      <div class="sync-row" id="syncRow">
        <span><i></i><span id="syncStatus" role="status">正在连接…</span></span>
        <span><button id="refreshButton">刷新</button><button id="signOutButton">退出</button></span>
      </div>

      <section class="notice migration" id="migrationPanel" hidden>
        <div><strong>发现 <span id="migrationCount">0</span> 条旧任务</strong><p>示例任务已自动排除，可幂等导入云端。</p></div>
        <button id="migrateButton">导入</button>
      </section>

      <section class="card summary">
        <div>
          <div id="rate" class="rate">0%</div>
          <div id="summaryText" class="muted">今天还没有任务</div>
          <div class="progress"><div id="bar" class="bar"></div></div>
        </div>
      </section>

      <h2 class="section-title">今天</h2>
      <section id="todayList" class="card task-card"></section>

      <section id="carryWrap" hidden>
        <h2 class="section-title">↪ 昨日延续</h2>
        <div id="carryList" class="card task-card"></div>
      </section>

      <h2 class="section-title">添加任务</h2>
      <section class="card">
        <form id="addForm" class="addbox">
          <input id="newTask" maxlength="200" required placeholder="输入今天要做的事" autocomplete="off">
          <button type="submit">添加</button>
        </form>
        <div class="hint">完成后直接打勾。保存失败会恢复原状态，不会产生“假完成”。</div>
      </section>

      <h2 class="section-title">最近完成</h2>
      <section id="history" class="card history"></section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="runtime-config.js"></script>
  <script type="module" src="today.js"></script>
</body>
</html>
