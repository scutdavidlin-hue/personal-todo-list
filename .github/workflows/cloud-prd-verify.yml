name: Cloud PRD Verify

on:
  push:
    branches:
      - fix/cloud-calendar-task-sync
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify main baseline
        id: baseline
        shell: bash
        run: |
          git worktree add /tmp/personal-os-main origin/main
          cd /tmp/personal-os-main
          set +e
          npm run verify 2>&1 | tee /tmp/main-verify.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify fix branch
        id: branch
        shell: bash
        run: |
          set +e
          npm run verify 2>&1 | tee /tmp/branch-verify.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record verification result
        shell: bash
        run: |
          baseline_status='${{ steps.baseline.outputs.status }}'
          branch_status='${{ steps.branch.outputs.status }}'
          {
            echo '# Cloud PRD verification'
            echo
            echo "- Branch: fix/cloud-calendar-task-sync"
            echo "- Commit tested: $GITHUB_SHA"
            echo "- main baseline npm run verify exit code: $baseline_status"
            echo "- fix branch npm run verify exit code: $branch_status"
            echo
            echo '## Main baseline failures'
            echo '```text'
            grep -n -E '^(not ok|# fail |# tests |# pass |# skipped )|AssertionError|ERR_ASSERTION|failureType|error:' /tmp/main-verify.log || true
            echo '```'
            echo
            echo '## Fix branch failures'
            echo '```text'
            grep -n -E '^(not ok|# fail |# tests |# pass |# skipped )|AssertionError|ERR_ASSERTION|failureType|error:' /tmp/branch-verify.log || true
            echo '```'
            echo
            echo '## Fix branch log tail'
            echo '```text'
            tail -n 80 /tmp/branch-verify.log
            echo '```'
          } > CLOUD_PRD_VERIFICATION.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLOUD_PRD_VERIFICATION.md
          git commit -m 'test: record cloud verification baseline comparison' || true
          git push origin HEAD:fix/cloud-calendar-task-sync

          if [ "$branch_status" != '0' ]; then
            exit "$branch_status"
          fi
